<?xml version="1.0" encoding="utf-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deck title</title>
  <style>
    html { color: #111111; background: #ffffff; }
    body {
      font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
      font-size: 1.125rem;
      line-height: 1.5;
      max-width: 40rem;
      margin: 1.5rem auto;
      padding: 0 1rem;
    }
    h1, h2, nav {
      font-family: system-ui, sans-serif;
      line-height: 1.3;
    }
    section { margin-top: 2.5rem; }
    .math-scroll { overflow-x: auto; max-width: 100%; }
    figure { margin: 1rem 0; }
    img { max-width: 100%; height: auto; }
    a:focus { outline: 3px solid #111111; outline-offset: 2px; }
  </style>
</head>
<body>
  <a href="#slides">Skip to slides</a>
  <h1>Deck title</h1>
  <nav aria-label="Slides">
    <ol>
      <li><a href="#slide-1">Slide title</a></li>
    </ol>
  </nav>
  <div id="slides">
    <section id="slide-1">
      <h2>Slide title</h2>
      <p>Replace this paragraph with the slide text. Keep an inline symbol in math, as in <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline" alttext="x"><mi>x</mi></math>.</p>
      <div class="math-scroll">
        <math xmlns="http://www.w3.org/1998/Math/MathML" display="block" alttext="a equals b">
          <mrow>
            <mi>a</mi>
            <mo>=</mo>
            <mi>b</mi>
          </mrow>
        </math>
      </div>
    </section>
  </div>
</body>
</html>
