[project]
name = "bob-academic-coach"
version = "0.1.0"
description = "Hackathon career coach — Agent B synthetic data and Agent D RSI prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
career = ["pypdf>=6.0,<7"]

[tool.setuptools.packages.find]
include = ["data*", "agent_d*", "career_coach*"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["."]
